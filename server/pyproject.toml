[project]
name = "lms"
version = "0.1.0"
description = "Library Management System API"
authors = [
    { name = "Xlin123", email = "xavier.li.1332@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.142.2",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
lms = "lms:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Test credentials and asserts are fine in tests.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
