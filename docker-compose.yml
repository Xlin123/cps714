services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    expose:
      - "4000"
    volumes:
      - lms-data:/app/data
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    depends_on:
      - app
    ports:
      - "4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_UPSTREAMS: http://app:4000/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      # Let the React app's own shell (and its "Sign in with Google" button) load
      # without being authenticated first; only /api/* is actually gated below.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/$,^/assets/,^/favicon.svg$,^/icons.svg$,^/login$,^/register$"
    restart: unless-stopped

volumes:
  lms-data:
